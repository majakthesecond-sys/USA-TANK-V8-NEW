<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1d2d"/>
      <stop offset="60%" stop-color="#132437"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9be7ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1a4b6e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b1118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a5e6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff7b2f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#burst)"/>
  <g opacity="0.35">
    <polygon points="0,900 520,520 740,900" fill="#0a0f16"/>
    <polygon points="520,900 980,520 1250,900" fill="#0c121a"/>
    <polygon points="980,900 1400,560 1600,900" fill="#0a1016"/>
  </g>
  <g opacity="0.6">
    <rect x="-100" y="120" width="900" height="10" fill="url(#flare)" transform="rotate(-18 0 0)"/>
    <rect x="300" y="80" width="1100" height="6" fill="url(#flare)" transform="rotate(12 0 0)"/>
    <rect x="-200" y="340" width="1200" height="8" fill="url(#flare)" transform="rotate(-10 0 0)"/>
  </g>
  <g opacity="0.45">
    <rect x="820" y="240" width="620" height="8" fill="url(#fire)" transform="rotate(-20 0 0)"/>
    <rect x="-50" y="420" width="520" height="6" fill="url(#fire)" transform="rotate(8 0 0)"/>
  </g>
  <g opacity="0.5">
    <circle cx="320" cy="320" r="180" fill="#0c1b28"/>
    <circle cx="1280" cy="260" r="140" fill="#0c1b28"/>
  </g>
</svg>
