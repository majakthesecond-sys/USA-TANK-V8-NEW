name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-desktop-game
    paths:
      - "desktop/**"
      - "public/**"
      - "package.json"
      - "server.js"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build offline Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install desktop game dependencies
        run: npm ci

      - name: Check desktop game syntax
        run: npm run check

      - name: Test installed-file runtime
        run: npm run test:offline

      - name: Build Windows installer
        run: npm run make:windows

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: USA-Tank-V8-Offline-Windows-Installer
          path: desktop/out/make/**/*.exe
          if-no-files-found: error
          retention-days: 30
